# Blueprint Render — voir https://render.com/docs/blueprint-spec
# Sur render.com : New > Blueprint > sélectionner ce dépôt.
#
# 3 services payants (plan Starter) sont créés : le site, la file d'attente/planificateur,
# et la base de données. C'est un choix assumé : le plan gratuit de Render redémarre le
# disque à chaque déploiement et supprime la base au bout de 30 jours (voir la discussion
# avec l'assistant) — inutilisable pour un site qui encaisse de vrais paiements.

databases:
  - name: univermboule-db
    databaseName: univermboule
    user: univermboule
    plan: starter
    postgresMajorVersion: "16"

services:
  # --- Le site (public + admin + agent) ---
  - type: web
    name: univermboule
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    # Exécuté avant chaque mise en ligne, sur UNE SEULE instance (pas de risque de migration
    # lancée deux fois en parallèle). Nécessite le plan Starter (indisponible en gratuit).
    preDeployCommand: php artisan migrate --force
    disk:
      name: univermboule-uploads
      # Affiches de spectacles et QR codes des billets : doivent survivre aux redéploiements.
      mountPath: /app/storage/app/public
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      # À corriger si vous renommez le service (l'adresse Render suit le "name" ci-dessus).
      - key: APP_URL
        value: https://univermboule.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: univermboule-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      # --- Commande via WhatsApp (aucun agrégateur de paiement) ---
      # Numéro qui reçoit les commandes des clients, format +22890000000
      - key: SUPPORT_WHATSAPP
        sync: false
      # Durée (en heures) pendant laquelle les places sont gardées en attendant le paiement
      - key: ORDER_HOLD_HOURS
        value: "24"
      # Email prévenu à chaque nouvelle commande (facultatif : laissez vide pour désactiver)
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      # --- Envoi des emails de billets : à remplacer par vos identifiants SMTP ---
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "Univers 2 M'boulè"

  # --- Envoi des emails en arrière-plan + libération des places non payées ---
  # Un seul service pour les deux tâches, afin de limiter les coûts : la même image Docker
  # que le site, mais lance queue:work et schedule:work au lieu du serveur web.
  - type: worker
    name: univermboule-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "php artisan schedule:work & exec php artisan queue:work --tries=3 --max-time=3600"
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        # Reprend automatiquement la clé générée pour le service "univermboule" ci-dessus :
        # les deux services DOIVENT utiliser la même clé (sessions, données chiffrées).
        fromService:
          name: univermboule
          type: web
          envVarKey: APP_KEY
      - key: APP_URL
        value: https://univermboule.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: univermboule-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "Univers 2 M'boulè"
