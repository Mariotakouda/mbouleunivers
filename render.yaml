# Blueprint Render — PLAN GRATUIT — voir https://render.com/docs/blueprint-spec
# Sur render.com : New > Blueprint > sélectionner ce dépôt.
#
# Un seul service (le site). Limites du plan gratuit à connaître :
#  - le site s'endort après ~15 min sans visite (le 1er visiteur attend ~1 min) ;
#  - le disque est effacé à chaque redémarrage : c'est pourquoi l'affiche et les QR codes sont
#    gérés sans fichier (voir MISE-A-JOUR-WHATSAPP.md) ;
#  - la base Postgres gratuite de Render expire au bout de 30 jours : on utilise une base
#    externe gratuite (ex. Neon) dont on colle l'adresse dans DB_URL.

services:
  - type: web
    name: univermboule
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      # À corriger si Render vous attribue une autre adresse que celle-ci.
      - key: APP_URL
        value: https://univermboule.onrender.com
      - key: APP_LOCALE
        value: fr
      # Adresse de connexion de la base externe (Neon), à coller dans le tableau de bord Render.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      # Pas de worker en gratuit : les tâches s'exécutent directement.
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      # --- Premier administrateur (créé au premier démarrage s'il n'existe pas encore) ---
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # --- Commande via WhatsApp ---
      - key: SUPPORT_WHATSAPP
        sync: false
      - key: ORDER_HOLD_HOURS
        value: "24"
      - key: PAYMENT_FLOOZ_NUMBER
        sync: false
      - key: PAYMENT_TMONEY_NUMBER
        sync: false
      - key: PAYMENT_ACCOUNT_NAME
        sync: false
      # --- Emails : désactivés par défaut (WhatsApp suffit). Renseignez un SMTP plus tard si besoin. ---
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: no-reply@universmboule.tg
      - key: MAIL_FROM_NAME
        value: "Univers 2 M'boulè"
